# Display name of workflow
name: Basic Workflow

# Control when the workflow will run,trigger manually by UI
on: 
  workflow_dispatch:
    inputs:
      name:
        description: "Person to Greet"
        default: "World"
        required: true
        type: string
      city:
        description: "Favorite City"
        required: true
        default: "Tupela"
        type: choice
        options:
          - New York
          - Seattle
          - Tupela
      fav-color-blue:
        description: "Is your favorite color blue"
        required: true
        type: boolean
# A workflow run is made up of one or more jobs
jobs:
  greet:
    # Display name for the job
    name: "Greetings Program"
    # The type of the runner job will run on
    runs-on: 
      - ubuntu-latest
    # Steps are a sequence of task that will be done as part of job
    steps:
      - name: Send Greeting
        run: |
          echo "Hello ${{github.event.inputs.name}}"
          echo "Your favorit city is ${{github.event.inputs.city}}"
          echo "Is your favorit color blue: ${{github.event.inputs.fav-color-blue}}"
