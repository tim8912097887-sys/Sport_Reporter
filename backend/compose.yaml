services:
 database:
  image: "postgres:latest"
  ports: 
   - "5433:5432"
  environment:
   - POSTGRES_PASSWORD=password
  networks:
   - my-network
  volumes:
   - my-volume:/var/lib/postgresql
 backend:
  build: ./
  ports: 
   - "3001:3001"
  env_file:
   - .env.pro
  networks:
   - my-network
  depends_on:
   - database
  restart: always
networks:
 my-network:
  driver: bridge
volumes:
 my-volume:

